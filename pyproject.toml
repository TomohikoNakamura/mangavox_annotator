[project]
name = "mangavox-annotator"
version = "1.0.0"
description = "MangaVox annotation tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.116.0",
    "loguru>=0.7.3",
    "opencv-python>=4.12.0.88",
    "pillow>=11.3.0",
    "soundfile>=0.13.1",
    "tqdm>=4.67.1",
    "xsdata[cli,lxml,soap]>=25.7",
]

[dependency-groups]
dev = [
    "mypy>=1.16.1",
    "ruff>=0.12.2",
    "types-pyyaml>=6.0.12.20250516",
    "types-tqdm>=4.67.0.20250516",
]

[tool.ruff]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
